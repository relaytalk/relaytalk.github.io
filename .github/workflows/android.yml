name: Build Android APK
 
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure www folder exists
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><title>RelayTalk</title></head><body></body></html>' > www/index.html
          fi

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli@6 add android
          fi

      - name: Verify icon exists
        run: |
          echo "Looking for resources/icon.png ..."
          ls -la resources/ || (echo "resources folder missing" && exit 1)
          if [ ! -f resources/icon.png ]; then
            echo "ERROR: resources/icon.png NOT FOUND"
            exit 1
          fi
          SIZE=$(wc -c < resources/icon.png)
          echo "OK: resources/icon.png found, size = $SIZE bytes"
          file resources/icon.png

      - name: Copy custom icon and splash into Android project
        run: |
          set -e
          SRC=resources/icon.png

          convert "$SRC" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$SRC" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert "$SRC" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$SRC" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert "$SRC" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$SRC" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert "$SRC" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert "$SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert "$SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          convert "$SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          mkdir -p android/app/src/main/res/drawable
          convert "$SRC" -resize 512x512 -background "#007acc" -gravity center -extent 512x512 android/app/src/main/res/drawable/splash.png

          echo "Verifying sizes:"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            echo "  mipmap-$d = $(wc -c < android/app/src/main/res/mipmap-$d/ic_launcher.png) bytes"
          done

      - name: Inject google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"
          fi

      - name: Apply google-services Gradle plugin
        run: |
          ROOT_KTS=android/build.gradle.kts
          if [ -f "$ROOT_KTS" ] && ! grep -q "com.google.gms.google-services" "$ROOT_KTS"; then
            if grep -q "plugins {" "$ROOT_KTS"; then
              awk '/plugins \{/ && !done { print; print "    id(\"com.google.gms.google-services\") version \"4.5.0\" apply false"; done=1; next } { print }' "$ROOT_KTS" > "$ROOT_KTS.tmp" && mv "$ROOT_KTS.tmp" "$ROOT_KTS"
            else
              printf 'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false\n}\n\n' | cat - "$ROOT_KTS" > "$ROOT_KTS.tmp" && mv "$ROOT_KTS.tmp" "$ROOT_KTS"
            fi
          fi

          APP_KTS=android/app/build.gradle.kts
          if [ -f "$APP_KTS" ] && ! grep -q "com.google.gms.google-services" "$APP_KTS"; then
            if grep -q "plugins {" "$APP_KTS"; then
              awk '/plugins \{/ && !done { print; print "    id(\"com.google.gms.google-services\")"; done=1; next } { print }' "$APP_KTS" > "$APP_KTS.tmp" && mv "$APP_KTS.tmp" "$APP_KTS"
            else
              printf 'plugins {\n    id("com.google.gms.google-services")\n}\n\n' | cat - "$APP_KTS" > "$APP_KTS.tmp" && mv "$APP_KTS.tmp" "$APP_KTS"
            fi
          fi

          APP=android/app/build.gradle
          if [ -f "$APP" ] && ! grep -q "com.google.gms.google-services" "$APP"; then
            printf '\napply plugin: %s\n' "'com.google.gms.google-services'" >> "$APP"
          fi

          ROOT=android/build.gradle
          if [ -f "$ROOT" ] && ! grep -q "com.google.gms:google-services" "$ROOT"; then
            awk '/classpath .com.android.tools.build:gradle/ && !done { print; print "        classpath \x27com.google.gms:google-services:4.4.2\x27"; done=1; next } { print }' "$ROOT" > "$ROOT.tmp" && mv "$ROOT.tmp" "$ROOT"
          fi

      - name: Patch AndroidManifest
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$FILE" ]; then echo "Manifest not found"; exit 1; fi

          if ! grep -q "POST_NOTIFICATIONS" "$FILE"; then
            awk '/<\/manifest>/ && !done {
              print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />";
              print "    <uses-permission android:name=\"android.permission.VIBRATE\" />";
              print "    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />";
              print "    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />";
              print "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />";
              print "    <uses-permission android:name=\"android.permission.USE_FULL_SCREEN_INTENT\" />";
              print "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />";
              print "    <uses-permission android:name=\"android.permission.CAMERA\" />";
              print "    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />";
              print "    <uses-permission android:name=\"android.permission.INTERNET\" />";
              print "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />";
              print "    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />";
              print "    <uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />";
              print "    <uses-feature android:name=\"android.hardware.microphone\" android:required=\"false\" />";
              print;
              done=1;
              next
            } { print }' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          fi

          if ! grep -q 'android:launchMode="singleTask"' "$FILE"; then
            awk '/<activity/ && /MainActivity/ && !done {
              if ($0 ~ /android:launchMode=/) { print }
              else { sub(/<activity/, "<activity android:launchMode=\"singleTask\""); print }
              done=1; next
            } { print }' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          fi

          if ! grep -q "FCM_PLUGIN_ACTIVITY" "$FILE"; then
            awk '/<\/activity>/ && !done {
              print "            <intent-filter>";
              print "                <action android:name=\"FCM_PLUGIN_ACTIVITY\" />";
              print "                <category android:name=\"android.intent.category.DEFAULT\" />";
              print "            </intent-filter>";
              print;
              done=1; next
            } { print }' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          fi

      - name: Decode release keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/relaytalk-release.keystore
          ls -la android/app/relaytalk-release.keystore
          echo "Keystore decoded ($(wc -c < android/app/relaytalk-release.keystore) bytes)"

      - name: Add signing config to app build.gradle.kts
        run: |
          APP_KTS=android/app/build.gradle.kts
          if [ -f "$APP_KTS" ] && ! grep -q "signingConfigs" "$APP_KTS"; then
            awk '
              /^android \{/ && !inserted {
                print
                print "    signingConfigs {"
                print "        create(\"release\") {"
                print "            storeFile = file(\"relaytalk-release.keystore\")"
                print "            storePassword = System.getenv(\"KEYSTORE_PASSWORD\") ?: \"\""
                print "            keyAlias = System.getenv(\"KEY_ALIAS\") ?: \"\""
                print "            keyPassword = System.getenv(\"KEY_PASSWORD\") ?: \"\""
                print "        }"
                print "    }"
                inserted=1
                next
              }
              { print }
            ' "$APP_KTS" > "$APP_KTS.tmp" && mv "$APP_KTS.tmp" "$APP_KTS"
            echo "signingConfigs block added"
          fi

          # Hook the signing config into the release buildType
          if [ -f "$APP_KTS" ] && grep -q 'getByName("release")' "$APP_KTS" && ! grep -q 'signingConfig = signingConfigs.getByName("release")' "$APP_KTS"; then
            awk '
              /getByName\("release"\)\s*\{/ && !inserted {
                print
                print "            signingConfig = signingConfigs.getByName(\"release\")"
                inserted=1
                next
              }
              { print }
            ' "$APP_KTS" > "$APP_KTS.tmp" && mv "$APP_KTS.tmp" "$APP_KTS"
            echo "release buildType patched"
          fi

          # Groovy fallback
          APP_GROOVY=android/app/build.gradle
          if [ -f "$APP_GROOVY" ] && ! grep -q "signingConfigs" "$APP_GROOVY"; then
            awk '
              /^android \{/ && !inserted {
                print
                print "    signingConfigs {"
                print "        release {"
                print "            storeFile file(\"relaytalk-release.keystore\")"
                print "            storePassword System.getenv(\"KEYSTORE_PASSWORD\") ?: \"\""
                print "            keyAlias System.getenv(\"KEY_ALIAS\") ?: \"\""
                print "            keyPassword System.getenv(\"KEY_PASSWORD\") ?: \"\""
                print "        }"
                print "    }"
                inserted=1
                next
              }
              { print }
            ' "$APP_GROOVY" > "$APP_GROOVY.tmp" && mv "$APP_GROOVY.tmp" "$APP_GROOVY"
          fi

          if [ -f "$APP_GROOVY" ] && grep -q 'release {' "$APP_GROOVY" && ! grep -q 'signingConfig signingConfigs.release' "$APP_GROOVY"; then
            awk '
              /release \{/ && !inserted {
                print
                print "            signingConfig signingConfigs.release"
                inserted=1
                next
              }
              { print }
            ' "$APP_GROOVY" > "$APP_GROOVY.tmp" && mv "$APP_GROOVY.tmp" "$APP_GROOVY"
          fi

      - name: Sync Capacitor
        run: npx --yes @capacitor/cli@6 sync android

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p release
          SRC=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "ERROR: Release APK not found at $SRC"
            ls -la android/app/build/outputs/apk/ || true
            exit 1
          fi
          cp "$SRC" release/relaytalk-${{ github.run_number }}.apk
          ls -la release/

      - name: Verify APK is signed
        run: |
          APK=release/relaytalk-${{ github.run_number }}.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || echo "Warning: apksigner check failed"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: relaytalk-apk-${{ github.run_number }}
          path: release/relaytalk-*.apk
          retention-days: 30

      - name: Create / update Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RelayTalk Build ${{ github.run_number }}
          body: |
            **Signed release build** — installs as "RelayTalk" on Android.

            Install:
            1. Download the APK below.
            2. Allow "Install unknown apps" when prompted.
            3. Open RelayTalk.
          files: release/relaytalk-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
