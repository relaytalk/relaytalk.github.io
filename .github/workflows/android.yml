name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure www folder exists
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><title>RelayTalk</title></head><body></body></html>' > www/index.html
          fi

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli@6 add android
          fi

      - name: Generate app icon and splash from resources/
        run: |
          mkdir -p resources
          if [ ! -f resources/icon.png ]; then
            echo "No resources/icon.png found - skipping"
          else
            echo "Found resources/icon.png - generating Android assets"
            npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          fi

      - name: Inject google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set - push notifications will not work"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"
          fi

      - name: Patch root build.gradle.kts for google-services
        run: |
          FILE=android/build.gradle.kts
          if [ -f "$FILE" ] && ! grep -q "com.google.gms.google-services" "$FILE"; then
            if grep -q "plugins {" "$FILE"; then
              awk '/plugins \{/ && !done { print; print "    id(\"com.google.gms.google-services\") version \"4.5.0\" apply false"; done=1; next } { print }' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            else
              printf 'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false\n}\n\n' | cat - "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            fi
            echo "Root build.gradle.kts patched"
          else
            echo "Root build.gradle.kts already patched or missing"
          fi

      - name: Patch app build.gradle.kts for google-services
        run: |
          FILE=android/app/build.gradle.kts
          if [ -f "$FILE" ] && ! grep -q "com.google.gms.google-services" "$FILE"; then
            if grep -q "plugins {" "$FILE"; then
              awk '/plugins \{/ && !done { print; print "    id(\"com.google.gms.google-services\")"; done=1; next } { print }' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            else
              printf 'plugins {\n    id("com.google.gms.google-services")\n}\n\n' | cat - "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            fi
            echo "App build.gradle.kts patched"
          else
            echo "App build.gradle.kts already patched or missing"
          fi

      - name: Patch Groovy gradle files if present
        run: |
          APP=android/app/build.gradle
          if [ -f "$APP" ] && ! grep -q "com.google.gms.google-services" "$APP"; then
            printf '\napply plugin: %s\n' "'com.google.gms.google-services'" >> "$APP"
            echo "App build.gradle (Groovy) patched"
          fi

          ROOT=android/build.gradle
          if [ -f "$ROOT" ] && ! grep -q "com.google.gms:google-services" "$ROOT"; then
            awk '/classpath .com.android.tools.build:gradle/ && !done { print; print "        classpath \x27com.google.gms:google-services:4.4.2\x27"; done=1; next } { print }' "$ROOT" > "$ROOT.tmp" && mv "$ROOT.tmp" "$ROOT"
            echo "Root build.gradle (Groovy) patched"
          fi

      - name: Patch AndroidManifest for push permissions
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$FILE" ]; then
            echo "Manifest not found"; exit 0
          fi

          if grep -q "POST_NOTIFICATIONS" "$FILE"; then
            echo "Permissions already present"
          else
            awk '/<\/manifest>/ && !done {
              print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />";
              print "    <uses-permission android:name=\"android.permission.VIBRATE\" />";
              print "    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />";
              print "    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />";
              print "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />";
              print "    <uses-permission android:name=\"android.permission.USE_FULL_SCREEN_INTENT\" />";
              print;
              done=1;
              next
            } { print }' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            echo "AndroidManifest.xml patched"
          fi

      - name: Sync Capacitor
        run: npx --yes @capacitor/cli@6 sync android

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/relaytalk-${{ github.run_number }}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: relaytalk-apk-${{ github.run_number }}
          path: release/relaytalk-*.apk
          retention-days: 30

      - name: Create / update Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RelayTalk Build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}.

            **Install on Android:**
            1. Download the APK below.
            2. Tap it and allow "Install unknown apps" when prompted.
            3. Open RelayTalk.
          files: release/relaytalk-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
