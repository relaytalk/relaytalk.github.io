name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure www folder exists
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><title>RelayTalk</title></head><body></body></html>' > www/index.html
          fi

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli@6 add android
          fi

      - name: Prepare icon/splash resources
        run: |
          mkdir -p resources
          if [ -f resources/icon.png ] && [ ! -f resources/splash.png ]; then
            cp resources/icon.png resources/splash.png
          fi
          if [ -f resources/splash.png ] && [ ! -f resources/splash-dark.png ]; then
            cp resources/splash.png resources/splash-dark.png
          fi
          if [ -f resources/icon.png ] && [ ! -f resources/icon-dark.png ]; then
            cp resources/icon.png resources/icon-dark.png
          fi

      - name: Generate app icon and splash
        run: |
          if [ ! -f resources/icon.png ]; then
            echo "No resources/icon.png found — skipping"
            exit 0
          fi
          npx --yes @capacitor/assets@3 generate \
            --android \
            --iconBackgroundColor '#007acc' \
            --iconBackgroundColorDark '#007acc' \
            --splashBackgroundColor '#007acc' \
            --splashBackgroundColorDark '#007acc'

      - name: Inject google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"
          fi

      - name: Apply google-services Gradle plugin
        run: |
          ROOT_KTS=android/build.gradle.kts
          if [ -f "$ROOT_KTS" ] && ! grep -q "com.google.gms.google-services" "$ROOT_KTS"; then
            if grep -q "plugins {" "$ROOT_KTS"; then
              awk '/plugins \{/ && !done { print; print "    id(\"com.google.gms.google-services\") version \"4.5.0\" apply false"; done=1; next } { print }' "$ROOT_KTS" > "$ROOT_KTS.tmp" && mv "$ROOT_KTS.tmp" "$ROOT_KTS"
            else
              printf 'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false\n}\n\n' | cat - "$ROOT_KTS" > "$ROOT_KTS.tmp" && mv "$ROOT_KTS.tmp" "$ROOT_KTS"
            fi
          fi

          APP_KTS=android/app/build.gradle.kts
          if [ -f "$APP_KTS" ] && ! grep -q "com.google.gms.google-services" "$APP_KTS"; then
            if grep -q "plugins {" "$APP_KTS"; then
              awk '/plugins \{/ && !done { print; print "    id(\"com.google.gms.google-services\")"; done=1; next } { print }' "$APP_KTS" > "$APP_KTS.tmp" && mv "$APP_KTS.tmp" "$APP_KTS"
            else
              printf 'plugins {\n    id("com.google.gms.google-services")\n}\n\n' | cat - "$APP_KTS" > "$APP_KTS.tmp" && mv "$APP_KTS.tmp" "$APP_KTS"
            fi
          fi

          APP=android/app/build.gradle
          if [ -f "$APP" ] && ! grep -q "com.google.gms.google-services" "$APP"; then
            printf '\napply plugin: %s\n' "'com.google.gms.google-services'" >> "$APP"
          fi

          ROOT=android/build.gradle
          if [ -f "$ROOT" ] && ! grep -q "com.google.gms:google-services" "$ROOT"; then
            awk '/classpath .com.android.tools.build:gradle/ && !done { print; print "        classpath \x27com.google.gms:google-services:4.4.2\x27"; done=1; next } { print }' "$ROOT" > "$ROOT.tmp" && mv "$ROOT.tmp" "$ROOT"
          fi

      - name: Patch AndroidManifest for push + notification tap
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$FILE" ]; then echo "Manifest not found"; exit 0; fi

          # 1. Add permissions once
          if ! grep -q "POST_NOTIFICATIONS" "$FILE"; then
            awk '/<\/manifest>/ && !done {
              print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />";
              print "    <uses-permission android:name=\"android.permission.VIBRATE\" />";
              print "    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />";
              print "    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />";
              print "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />";
              print "    <uses-permission android:name=\"android.permission.USE_FULL_SCREEN_INTENT\" />";
              print;
              done=1;
              next
            } { print }' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            echo "Permissions added"
          fi

          # 2. Ensure MainActivity has launchMode="singleTask" so tapping
          #    the notification resumes the existing task instead of
          #    launching a new one silently.
          if ! grep -q 'android:launchMode="singleTask"' "$FILE"; then
            # Add launchMode to the MainActivity <activity> tag
            awk '
              /<activity/ && /MainActivity/ && !done {
                if ($0 ~ /android:launchMode=/) {
                  print
                } else {
                  sub(/<activity/, "<activity android:launchMode=\"singleTask\"")
                  print
                }
                done=1
                next
              }
              { print }
            ' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            echo "MainActivity launchMode=singleTask ensured"
          fi

          # 3. Ensure the MainActivity has an intent-filter that catches
          #    FCM_PLUGIN_ACTIVITY so notification taps route back to the app.
          if ! grep -q "FCM_PLUGIN_ACTIVITY" "$FILE"; then
            awk '
              /<\/activity>/ && /MainActivity/ { }
              /<\/activity>/ && !done {
                print "            <intent-filter>";
                print "                <action android:name=\"FCM_PLUGIN_ACTIVITY\" />";
                print "                <category android:name=\"android.intent.category.DEFAULT\" />";
                print "            </intent-filter>";
                print;
                done=1;
                next
              }
              { print }
            ' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            echo "FCM_PLUGIN_ACTIVITY intent-filter added"
          fi

          echo "=== AndroidManifest.xml (activity section) ==="
          grep -A6 "<activity" "$FILE" | head -40 || true

      - name: Sync Capacitor
        run: npx --yes @capacitor/cli@6 sync android

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/relaytalk-${{ github.run_number }}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: relaytalk-apk-${{ github.run_number }}
          path: release/relaytalk-*.apk
          retention-days: 30

      - name: Create / update Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RelayTalk Build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}.

            **Install on Android:**
            1. Download the APK below.
            2. Tap it and allow "Install unknown apps" when prompted.
            3. Open RelayTalk.
          files: release/relaytalk-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}