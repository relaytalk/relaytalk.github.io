name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure www folder exists
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>RelayTalk</title></head><body></body></html>' > www/index.html
          fi

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli@6 add android
          fi

      - name: Generate app icon and splash from resources/
        run: |
          mkdir -p resources
          if [ ! -f resources/icon.png ]; then
            echo "❌ resources/icon.png not found — skipping"
          else
            echo "✅ Found resources/icon.png — generating Android assets"
            npx --yes @capacitor/assets@3 generate \
              --android \
              --iconBackgroundColor '#ffffff' \
              --iconBackgroundColorDark '#ffffff' \
              --splashBackgroundColor '#ffffff' \
              --splashBackgroundColorDark '#ffffff'
          fi

      - name: Sync Capacitor
        run: npx --yes @capacitor/cli@6 sync android

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/relaytalk-${GITHUB_RUN_NUMBER}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: relaytalk-apk-${{ github.run_number }}
          path: release/relaytalk-*.apk
          retention-days: 30

      - name: Create / update Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RelayTalk Build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}.

            **Install on Android:**
            1. Download the APK below.
            2. Tap it and allow "Install unknown apps" when prompted.
            3. Open RelayTalk.
          files: release/relaytalk-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
