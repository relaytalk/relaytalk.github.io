    <!-- ONESIGNAL SDK - COMPLETE SETUP WITH AUTO-PERMISSION -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: "57235c48-d945-4cd6-9b7e-5e3823144539",
                safari_web_id: "web.onesignal.auto.445d0d2a-d94a-41a6-9db5-6271b7cfba3f",
                notifyButton: {
                    enable: true,
                },
                serviceWorkerPath: "/OneSignalSDK.sw.js",
                serviceWorkerParam: { scope: "/" },
                allowLocalhostAsSecureOrigin: true,
                autoRegister: true,
                autoPrompt: true,
                promptOptions: {
                    autoPrompt: true,
                    clickToAllow: true
                }
            });
            
            console.log('✅ OneSignal initialized');
            
            // Auto-request permission after 3 seconds
            setTimeout(async () => {
                const permission = await OneSignal.Notifications.getPermission();
                if (permission === 'default') {
                    console.log('🔔 Auto-requesting notification permission...');
                    await OneSignal.Notifications.requestPermission();
                }
            }, 3000);
        });
    </script>

    <style>
        /* CHROME MOBILE IMAGE RENDERING FIXES */
        img[src*="ibb.co"], img[src*="i.ibb.co"] {
            content-visibility: auto;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
        }

        /* CHROME MOBILE TOUCH FIXES */
        button, input, textarea {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* PREVENT BLUE HIGHLIGHT */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* PREVENT TEXT SIZE ADJUSTMENT */
        html {
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            text-size-adjust: 100%;
            overflow-x: hidden;
        }

        /* MOBILE-ONLY STYLES */

            .messages-container img {
                max-width: 100% !important;
                height: auto !important;
                display: block;
                border-radius: 12px;
            }

            .message-image {
                max-width: 280px !important;
                max-height: 400px !important;
                object-fit: contain;
            }

            body {
                overscroll-behavior-y: none;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* Login Overlay Styles */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.5s ease;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .login-container {
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 35px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.4s ease;
            margin: env(safe-area-inset-top) auto env(safe-area-inset-bottom);
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .login-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .login-container h2 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-container p {
            color: #a0a0c0;
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.5;

        .login-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;

            to { opacity: 1; }

    <!-- ADVANCED MOBILE DETECTION & FIXES -->
    <script>
        // Enhanced mobile Chrome detection
        function isMobileChrome() {
            const ua = navigator.userAgent;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            const isChrome = /Chrome/i.test(ua) && !/Edge|Edg|OPR/i.test(ua);
            return isMobile && isChrome;
        }

        function isIOSChrome() {
            const ua = navigator.userAgent;
            return /CriOS/i.test(ua) && /iPhone|iPad|iPod/i.test(ua);
        }

        // Apply Chrome mobile fixes
        function applyChromeMobileFixes() {
            if (isMobileChrome() || isIOSChrome()) {
                console.log('Chrome Mobile detected - applying fixes');

                // Apply fixes to document
                document.documentElement.setAttribute('data-chrome-mobile', 'true');

                // Prevent double-tap zoom
                let lastTouchEnd = 0;
                document.addEventListener('touchend', function(event) {
                    const now = Date.now();
                    if (now - lastTouchEnd <= 300) {
                        event.preventDefault();
                    }
                    lastTouchEnd = now;
                }, false);

                // Prevent pull-to-refresh
                document.body.style.overscrollBehavior = 'none';

                // Fix 100vh issue on Chrome mobile
                function setVH() {
                    let vh = window.innerHeight * 0.01;
                    document.documentElement.style.setProperty('--vh', `${vh}px`);
                }
                setVH();
                window.addEventListener('resize', setVH);

                // Add Chrome mobile class for CSS targeting
                document.body.classList.add('chrome-mobile');

                // Pre-warm ImgBB connections
                if (window.navigator.connection) {
                    const conn = window.navigator.connection;
                    if (conn.saveData === false) {
                        // Preconnect to ImgBB on good connections
                        const preconnect = document.createElement('link');
                        preconnect.rel = 'preconnect';
                        preconnect.href = 'https://i.ibb.co';
                        document.head.appendChild(preconnect);
                    }
                }

                return true;
            }
            return false;
        }

        // Initialize fixes on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyChromeMobileFixes);
        } else {
            applyChromeMobileFixes();
        }

        // Fix for Chrome mobile image loading
        function fixImgBBUrls(url) {
            if (isMobileChrome() && url && url.includes('ibb.co')) {
                // Always use i.ibb.co CDN for Chrome mobile
                url = url.replace('https://ibb.co/', 'https://i.ibb.co/');
                if (!url.includes('.jpg') && !url.includes('.png') && !url.includes('.gif')) {
                    url += '.jpg';
                }
                // Add cache busting for Chrome mobile
                url += (url.includes('?') ? '&' : '?') + 't=' + Date.now();
            }
            return url;
        }

        // Make function globally available
        window.fixImgBBUrls = fixImgBBUrls;
        window.isMobileChrome = isMobileChrome;
    </script>

    <!-- MANUAL NOTIFICATION TRIGGER BUTTON (for testing) -->
    <button id="enableNotificationsBtn" style="position: fixed; bottom: 20px; right: 20px; background: #667eea; color: white; border: none; border-radius: 50px; padding: 12px 20px; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); z-index: 9999; display: none;">
        🔔 Enable Notifications
    </button>

    <script>
        // Show the enable notifications button if permission not granted
        setTimeout(() => {
            if (window.OneSignal) {
                window.OneSignal.Notifications.getPermission().then(permission => {
                    if (permission === 'default') {
                        document.getElementById('enableNotificationsBtn').style.display = 'block';
                    }
                });
            }
        }, 5000);

        // Handle button click
        document.getElementById('enableNotificationsBtn').addEventListener('click', async () => {
            if (window.OneSignal) {
                await window.OneSignal.Notifications.requestPermission();
                document.getElementById('enableNotificationsBtn').style.display = 'none';
            }
        });
    </script>
