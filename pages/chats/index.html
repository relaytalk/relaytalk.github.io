<html lang="en">
<head>

    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preconnect" href="https://i.ibb.co" crossorigin>
    <link rel="dns-prefetch" href="https://i.ibb.co">
    <link rel="preconnect" href="https://kponqaktavkrchebmiwr.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://kponqaktavkrchebmiwr.supabase.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta property="og:title" content="RelayTalk Chat">
    <meta property="og:description" content="Real-time chat application with image sharing">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://relaytalk.github.io">
    <meta property="og:image" content="https://i.ibb.co/placeholder/relaytalk-og.png">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/relay.png">
    <link rel="manifest" href="/manifest.json">

    <title>RelayTalk Chat</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chat-responsive.css">
</head>
<body>
    <!-- Login Overlay -->
    <div id="login" class="login-overlay" style="display: none;">
        <div class="login-container">
            <div class="login-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"/>
                </svg>
            </div>
            <h2>Login Required</h2>
            <p>Please login to continue chatting with your friends</p>
            <div class="login-buttons">
                <button id="loginBtn" class="btn-primary">Login</button>
                <button id="signupBtn" class="btn-secondary">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Chat Interface -->
    <div id="chat" style="display: none;">
        <!-- Chat Header -->
        <header class="chat-header">
            <button class="back-btn" onclick="goBack()" aria-label="Back">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="chat-user-info" id="chatHeaderProfile" role="button" tabindex="0">
                <div class="chat-user-avatar" id="chatUserAvatar">U</div>
                <div class="chat-user-details">
                    <h3 id="chatUserName">User</h3>
                    <div class="chat-user-status">
                        <span id="statusDot" class="status-dot offline"></span>
                        <span id="statusText">Offline</span>
                    </div>
                </div>
            </div>
            <div class="chat-actions">
                <button class="guide-btn" id="chatGuideBtn" onclick="openGuide()" aria-label="Guide">
                    <i class="fas fa-circle-question"></i>
                </button>
                <button class="call-btn" id="chatCallBtn" onclick="callCurrentFriend()" aria-label="Call friend">
                    <i class="fas fa-phone"></i>
                </button>
            </div>

            <div class="top-action-bar" id="topActionBar" style="display: none;"></div>
        </header>

        <!-- Main Chat Area -->
        <main class="main-content">
            <div class="messages-container" id="messagesContainer">
                <div class="empty-chat">
                    <svg class="empty-chat-icon" viewBox="0 0 24 24">
                        <path d="M20,2H4A2,2 0 0,0 2,4V22L6,18H20A2,2 0 0,0 22,16V4A2,2 0 0,0 20,2Z"/>
                    </svg>
                    <h3>Start the conversation</h3>
                    <p>Say hello to your friend!</p>
                </div>
            </div>
        </main>

        <!-- Message Input -->
        <div class="message-input-wrapper">
            <div class="message-input-container">
                <button class="attach-btn" id="attachBtn" onclick="showImagePicker()" aria-label="Attach">
                    <i class="fas fa-paperclip"></i>
                </button>
                <textarea
                    class="message-input"
                    id="messageInput"
                    placeholder="Type a message..."
                    rows="1"
                    onkeydown="handleKeyPress(event)"
                    oninput="autoResize(this)"
                    style="min-height: 50px;"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled aria-label="Send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Image Picker -->
    <div class="image-picker-overlay" id="imagePickerOverlay" style="display: none;">
        <div class="image-picker-container">
            <div class="image-picker-header">
                <h3>Share Images</h3>
                <button class="image-picker-close" onclick="closeImagePicker()" aria-label="Close">×</button>
            </div>
            <div class="image-picker-options">
                <button class="image-picker-option" onclick="openCamera()">
                    <span class="picker-icon"><i class="fas fa-camera"></i></span>
                    Take Photo
                </button>
                <button class="image-picker-option" onclick="openGallery()">
                    <span class="picker-icon"><i class="fas fa-image"></i></span>
                    Choose from Gallery
                </button>
            </div>
        </div>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="galleryInput" accept="image/*" multiple style="display: none;">

    <!-- User Info Modal -->
    <div class="modal-overlay" id="userInfoModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">User Info</h3>
                <button class="modal-close" onclick="closeModal()" aria-label="Close">×</button>
            </div>
            <div class="modal-body" id="userInfoContent"></div>
        </div>
    </div>

    <!-- Guide Modal -->
    <div class="modal-overlay" id="guideModal" style="display: none;">
        <div class="modal-content guide-modal-content">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-circle-question guide-title-icon"></i> Chat Guide</h3>
                <button class="modal-close" onclick="closeGuide()" aria-label="Close">×</button>
            </div>
            <div class="modal-body guide-body"></div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="modal-overlay" id="customAlert" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="alertTitle">Alert</h3>
                <button class="modal-close" onclick="document.getElementById('customAlert').style.display='none'">×</button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div id="alertIcon" style="font-size: 3rem; margin-bottom: 15px;"></div>
                    <p id="alertMessage">Message goes here</p>
                </div>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                    <button id="alertConfirm" class="btn-primary" style="min-width: 100px;">OK</button>
                    <button id="alertCancel" class="btn-secondary" style="min-width: 100px; display: none;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="modal-overlay" id="customToast" style="display: none; align-items: flex-end; justify-content: center; background: transparent; pointer-events: none;">
        <div class="toast-content" style="max-width: 320px; margin-bottom: 30px; text-align: center;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="toastIcon" style="font-size: 1.2rem;"></span>
                <p id="toastMessage" style="margin: 0; font-size: 0.9rem;"></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
    <script type="module" src="/utils/callHub.js"></script>

    <script>
        window.callCurrentFriend = function() {
            const friend = window.chatFriend;

            if (!friend || !friend.id) {
                if (typeof window.showToast === 'function') {
                    window.showToast('Friend info not ready yet', '⚠️', 1500);
                } else {
                    alert('Friend info not ready yet');
                }
                return;
            }

            if (typeof window.startCall !== 'function') {
                if (typeof window.showToast === 'function') {
                    window.showToast('Calling service not ready yet', '⚠️', 1500);
                } else {
                    alert('Calling service not ready yet');
                }
                return;
            }

            console.log('📞 [chats] Triggering call to:', friend.id, friend.username);
            window.startCall(friend.id, friend.username || 'Friend');
        };

        function isMobileChrome() {
            const ua = navigator.userAgent;
            return (/Android/i.test(ua) && /Chrome/i.test(ua) && !/Edg/i.test(ua));
        }

        function applyChromeMobileFixes() {
            if (isMobileChrome()) {
                document.body.classList.add('chrome-mobile');
                let vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
                window.addEventListener('resize', () => {
                    let vh = window.innerHeight * 0.01;
                    document.documentElement.style.setProperty('--vh', `${vh}px`);
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyChromeMobileFixes);
        } else {
            applyChromeMobileFixes();
        }

        function fixImgBBUrls(url) {
            if (isMobileChrome() && url && url.includes('ibb.co')) {
                url = url.replace('https://ibb.co/', 'https://i.ibb.co/');
                if (!url.includes('.jpg') && !url.includes('.png') && !url.includes('.gif')) {
                    url += '.jpg';
                }
            }
            return url;
        }

        window.fixImgBBUrls = fixImgBBUrls;
        window.isMobileChrome = isMobileChrome;
    </script>
</body>
</html>
