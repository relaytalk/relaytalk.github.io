    <!-- ADVANCED MOBILE DETECTION & FIXES -->
    <script>
        // Enhanced mobile Chrome detection
        function isMobileChrome() {
            const ua = navigator.userAgent;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            const isChrome = /Chrome/i.test(ua) && !/Edge|Edg|OPR/i.test(ua);
            return isMobile && isChrome;
        }

        function isIOSChrome() {
            const ua = navigator.userAgent;
            return /CriOS/i.test(ua) && /iPhone|iPad|iPod/i.test(ua);
        }

        // Apply Chrome mobile fixes
        function applyChromeMobileFixes() {
            if (isMobileChrome() || isIOSChrome()) {
                console.log('Chrome Mobile detected - applying fixes');

                document.documentElement.setAttribute('data-chrome-mobile', 'true');

                let lastTouchEnd = 0;
                document.addEventListener('touchend', function(event) {
                    const now = Date.now();
                    if (now - lastTouchEnd <= 300) {
                        event.preventDefault();
                    }
                    lastTouchEnd = now;
                }, false);

                document.body.style.overscrollBehavior = 'none';

                function setVH() {
                    let vh = window.innerHeight * 0.01;
                    document.documentElement.style.setProperty('--vh', `${vh}px`);
                }
                setVH();
                window.addEventListener('resize', setVH);

                document.body.classList.add('chrome-mobile');

                if (window.navigator.connection) {
                    const conn = window.navigator.connection;
                    if (conn.saveData === false) {
                        const preconnect = document.createElement('link');
                        preconnect.rel = 'preconnect';
                        preconnect.href = 'https://i.ibb.co';
                        document.head.appendChild(preconnect);
                    }
                }

                return true;
            }
            return false;
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyChromeMobileFixes);
        } else {
            applyChromeMobileFixes();
        }

        function fixImgBBUrls(url) {
            if (isMobileChrome() && url && url.includes('ibb.co')) {
                url = url.replace('https://ibb.co/', 'https://i.ibb.co/');
                if (!url.includes('.jpg') && !url.includes('.png') && !url.includes('.gif')) {
                    url += '.jpg';
                }
                url += (url.includes('?') ? '&' : '?') + 't=' + Date.now();
            }
            return url;
        }

        window.fixImgBBUrls = fixImgBBUrls;
        window.isMobileChrome = isMobileChrome;
    </script>

// Convert base64 to Uint8Array
function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
}

            showNotification('Push not supported', 'error');
            return null;
        }

        // Register push service worker
        let swPath = 'push-sw.js';
        if (window.location.pathname.includes('/pages/')) {
            swPath = '../../push-sw.js';
        } else if (window.location.pathname.includes('/utils/')) {
            swPath = '../push-sw.js';
        }

        const registration = await navigator.serviceWorker.register(swPath);
        console.log('✅ Push SW registered');

        // Convert VAPID key
        const convertedKey = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);

        // Subscribe
        const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: convertedKey
        });

        console.log('✅ Push subscribed:', subscription);
        return subscription;
    } catch (error) {
        console.log('❌ Push subscription error:', error);
        return null;
    }
}

// Request notification permission
async function enableNotifications() {
    try {
        const permission = await Notification.requestPermission();
        
        if (permission === 'granted') {
            const subscription = await subscribeToPush();
            if (subscription) {
                return await saveSubscription(subscription);
            }
            return false;
        } else {
            showNotification('Notification permission denied', 'error');
            return false;
        }
    } catch (error) {
        console.log('❌ Error enabling notifications:', error);
        return false;
    }
}

// Check if already subscribed
async function checkPushStatus() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        return false;
    }

    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.getSubscription();
    return !!subscription;
}

// Make functions available globally
window.NotificationManager = {
    enable: enableNotifications,
    checkStatus: checkPushStatus
};

// ============================================
// NOTIFICATION BUTTON SETUP

console.log('🔔 Setting up notification button...');

const notificationBtn = document.getElementById('notificationToggleBtn');
const notificationBadgeSmall = document.getElementById('notificationBadgeSmall');
const notificationTooltip = document.getElementById('notificationTooltip');
const tooltipMessage = document.getElementById('tooltipMessage');

// Show button after a delay
setTimeout(() => {
    if (notificationBtn) {
        notificationBtn.style.display = 'flex';
    }
}, 2000);

// Helper to get permission status
function getPermissionStatus() {
    if (window.Notification && Notification.permission) {
        return Notification.permission;
    }
    return 'default';
}

// Update button appearance
function updateNotificationButton() {
    if (!notificationBtn) return;
    
    const permission = getPermissionStatus();
    console.log('🔔 Permission status:', permission);
    
    notificationBtn.classList.remove('has-permission', 'denied');
    
    if (permission === 'granted') {
        notificationBtn.classList.add('has-permission');
        notificationBtn.innerHTML = '<i class="fas fa-bell"></i><i class="fas fa-check" style="position: absolute; bottom: 0; right: 0; font-size: 0.7rem; color: white; background: #28a745; border-radius: 50%; padding: 2px;"></i>';
        tooltipMessage.textContent = 'Notifications enabled ✓';
        if (notificationBadgeSmall) notificationBadgeSmall.style.display = 'none';
        notificationBtn.style.animation = '';
    } else if (permission === 'denied') {
        notificationBtn.classList.add('denied');
        notificationBtn.innerHTML = '<i class="fas fa-bell-slash"></i>';
        tooltipMessage.innerHTML = 'Notifications blocked';
        notificationBtn.style.animation = '';
    } else {
        notificationBtn.innerHTML = '<i class="fas fa-bell"></i>';
        tooltipMessage.textContent = 'Click to enable notifications';
        notificationBtn.style.animation = 'pulse 2s infinite';
    }
}

// Handle button click - NEW VERSION
if (notificationBtn) {
    // Remove any existing click listeners
    notificationBtn.replaceWith(notificationBtn.cloneNode(true));
    
    // Get the fresh button
    const freshBtn = document.getElementById('notificationToggleBtn');
    
    // Add new click handler
    freshBtn.addEventListener('click', async function(e) {
        e.stopPropagation();
        
        if (window.NotificationManager) {
            // Show tooltip
            notificationTooltip.style.display = 'block';
            
            const permission = getPermissionStatus();
            
            if (permission === 'granted') {
                tooltipMessage.textContent = 'Notifications already enabled ✓';
                setTimeout(() => notificationTooltip.style.display = 'none', 2000);
            } else if (permission === 'denied') {
                tooltipMessage.innerHTML = '🔒 Notifications blocked. Click lock icon in address bar → Site Settings → Allow';
            } else {
                tooltipMessage.textContent = '🔔 Enabling notifications...';
                
                // Enable notifications
                const success = await window.NotificationManager.enable();
                
                if (success) {
                    this.classList.add('has-permission');
                    this.innerHTML = '<i class="fas fa-bell"></i><i class="fas fa-check" style="position: absolute; bottom: 0; right: 0; font-size: 0.7rem; color: white; background: #28a745; border-radius: 50%; padding: 2px;"></i>';
                    tooltipMessage.textContent = '✓ Notifications enabled!';
                } else {
                    tooltipMessage.textContent = '❌ Failed to enable';
                }
                
                setTimeout(() => {
                    notificationTooltip.style.display = 'none';
                }, 2000);
            }
        }
    });

    // Hide tooltip when clicking elsewhere
    document.addEventListener('click', function(e) {
        if (!freshBtn.contains(e.target) && !notificationTooltip.contains(e.target)) {
            notificationTooltip.style.display = 'none';
        }
    });
}

// Initial update
updateNotificationButton();
setInterval(updateNotificationButton, 5000);

// Check status on load
setTimeout(async () => {
    if (window.NotificationManager) {
        const hasPush = await window.NotificationManager.checkStatus();
        if (hasPush) {
            updateNotificationButton();
        }
    }
}, 3000);

    <!-- Auto-save token when user is logged in and OneSignal has ID -->
    <script>
        (function() {
            // Wait for both Supabase and OneSignal
            let supabaseReady = false;
            let oneSignalReady = false;
            
            function trySaveToken() {
                if (!supabaseReady || !oneSignalReady) return;
                
                window.OneSignal.push(function() {
                    window.OneSignal.getUserId(function(id) {
                        if (!id) return;
                        
                        window.supabase.auth.getSession().then(sessionData => {
                            const token = sessionData.data.session?.access_token;
                            if (!token) return;
                            
                            fetch('https://blxtldgnssvasuinpyit.supabase.co/functions/v1/register-push-token', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    onesignal_player_id: id,
                                    device_type: 'web',
                                    browser_info: navigator.userAgent
                                })
                            }).then(res => res.json()).then(data => {
                                console.log('✅ Token auto-saved:', data);
                            });
                        });
                    });
                });
            }
            
            // Check Supabase
            let supabaseChecks = 0;
            const supabaseInterval = setInterval(() => {
                supabaseChecks++;
                if (window.supabase?.auth) {
                    supabaseReady = true;
                    clearInterval(supabaseInterval);
                    trySaveToken();
                } else if (supabaseChecks > 30) {
                    clearInterval(supabaseInterval);
                }
            }, 200);
            
            // Check OneSignal
            waitForOneSignal(() => {
                oneSignalReady = true;
                trySaveToken();
            });
        })();
    </script>
