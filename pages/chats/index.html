<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- CSP -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https://*.supabase.co https://api.supabase.com https://*.supabase.in https://api.imgbb.com https://*.ibb.co https://i.ibb.co https://*.github.io https://github.com https://fonts.googleapis.com https://cdn.onesignal.com https://onesignal.com https://*.onesignal.com https://cdnjs.cloudflare.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://api.supabase.com https://cdn.jsdelivr.net https://fonts.googleapis.com https://i.ibb.co https://ibb.co https://cdn.onesignal.com https://onesignal.com https://*.onesignal.com https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://fonts.gstatic.com https://cdn.onesignal.com https://onesignal.com https://cdnjs.cloudflare.com;
        img-src 'self' data: blob: https://*.ibb.co https://i.ibb.co https://*.imgbb.com https:;
        font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdn.onesignal.com https://cdnjs.cloudflare.com;
        connect-src 'self' wss://*.supabase.co https://*.supabase.co https://api.supabase.com https://api.imgbb.com https://*.github.io https://i.ibb.co https://ibb.co https://onesignal.com https://*.onesignal.com wss://onesignal.com https://clientapi.onesignal.com https://sync.onesignal.com https://device.onesignal.com;
        worker-src 'self' blob: https://cdn.onesignal.com https://onesignal.com;
        media-src 'self' https://i.ibb.co https://*.ibb.co;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-src 'none';
    ">

    <!-- Preloads -->
    <link rel="preconnect" href="https://i.ibb.co" crossorigin>
    <link rel="preconnect" href="https://cdn.onesignal.com" crossorigin>
    <link rel="dns-prefetch" href="https://i.ibb.co">
    <link rel="dns-prefetch" href="https://cdn.onesignal.com">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Open Graph -->
    <meta property="og:title" content="RelayTalk Chat">
    <meta property="og:description" content="Real-time chat application with image sharing">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://relaytalk.github.io">
    <meta property="og:image" content="https://i.ibb.co/placeholder/relaytalk-og.png">

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/relay.png">
    <link rel="manifest" href="/manifest.json">

    <title>RelayTalk Chat</title>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Overlay -->
    <div id="login" class="login-overlay" style="display: none;">
        <div class="login-container">
            <div class="login-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"/>
                </svg>
            </div>
            <h2>Login Required</h2>
            <p>Please login to continue chatting with your friends</p>
            <div class="login-buttons">
                <button id="loginBtn" class="btn-primary">Login</button>
                <button id="signupBtn" class="btn-secondary">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Chat Interface -->
    <div id="chat" style="display: none;">
        <!-- Chat Header - ONLY NOTIFICATION BUTTON -->
        <header class="chat-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="chat-user-info">
                <div class="chat-user-avatar" id="chatUserAvatar">U</div>
                <div class="chat-user-details">
                    <h3 id="chatUserName">User</h3>
                    <div class="chat-user-status">
                        <span id="statusDot" class="status-dot offline"></span>
                        <span id="statusText">Offline</span>
                    </div>
                </div>
            </div>
            <div class="chat-actions">
                <!-- ONLY NOTIFICATION BUTTON -->
                <button id="notificationToggleBtn" class="notification-toggle-btn" style="display: none;">
                    <i class="fas fa-bell"></i>
                    <span id="notificationBadgeSmall" class="notification-badge-small" style="display: none;">1</span>
                </button>
            </div>
        </header>

        <!-- Notification Tooltip -->
        <div id="notificationTooltip" class="notification-tooltip" style="display: none;">
            <p><i class="fas fa-bell"></i> <span id="tooltipMessage">Enable notifications to get alerts</span></p>
        </div>

        <!-- Main Chat Area -->
        <main class="main-content">
            <div class="messages-container" id="messagesContainer">
                <div class="empty-chat">
                    <svg class="empty-chat-icon" viewBox="0 0 24 24">
                        <path d="M20,2H4A2,2 0 0,0 2,4V22L6,18H20A2,2 0 0,0 22,16V4A2,2 0 0,0 20,2Z"/>
                    </svg>
                    <h3>Start the conversation</h3>
                    <p>Say hello to your friend!</p>
                </div>
            </div>
        </main>

        <!-- Message Input -->
        <div class="message-input-wrapper">
            <div class="message-input-container">
                <button class="attach-btn" id="attachBtn" onclick="showImagePicker()">
                    <svg class="attach-icon" viewBox="0 0 24 24">
                        <path d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z"/>
                    </svg>
                </button>
                <textarea 
                    class="message-input" 
                    id="messageInput" 
                    placeholder="Type a message..."
                    rows="1"
                    onkeydown="handleKeyPress(event)"
                    oninput="autoResize(this)"
                    style="min-height: 50px;"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                    <svg class="send-icon" viewBox="0 0 24 24">
                        <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Image Picker -->
    <div class="image-picker-overlay" id="imagePickerOverlay" style="display: none;">
        <div class="image-picker-container">
            <div class="image-picker-header">
                <h3>Share Images</h3>
                <button class="image-picker-close" onclick="closeImagePicker()">×</button>
            </div>
            <div class="image-picker-options">
                <button class="image-picker-option" onclick="openCamera()">
                    <svg class="picker-icon" viewBox="0 0 24 24">
                        <path d="M4,4H7L9,2H15L17,4H20A2,2 0 0,1 22,6V18A2,2 0 0,1 20,20H4A2,2 0 0,1 2,18V6A2,2 0 0,1 4,4M12,7A5,5 0 0,0 7,12A5,5 0 0,0 12,17A5,5 0 0,0 17,12A5,5 0 0,0 12,7M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9Z"/>
                    </svg>
                    Take Photo
                </button>
                <button class="image-picker-option" onclick="openGallery()">
                    <svg class="picker-icon" viewBox="0 0 24 24">
                        <path d="M21,19V5C21,3.9 20.1,3 19,3H5C3.9,3 3,3.9 3,5V19C3,20.1 3.9,21 5,21H19C20.1,21 21,20.1 21,19M8.5,13.5L11,16.5L14.5,12L19,18H5L8.5,13.5Z"/>
                    </svg>
                    Choose from Gallery
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="galleryInput" accept="image/*" multiple style="display: none;">

    <!-- User Info Modal -->
    <div class="modal-overlay" id="userInfoModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">User Info</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="userInfoContent"></div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="modal-overlay" id="customAlert" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="alertTitle">Alert</h3>
                <button class="modal-close" onclick="document.getElementById('customAlert').style.display='none'">×</button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div id="alertIcon" style="font-size: 3rem; margin-bottom: 15px;"></div>
                    <p id="alertMessage">Message goes here</p>
                </div>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                    <button id="alertConfirm" class="btn-primary" style="min-width: 100px;">OK</button>
                    <button id="alertCancel" class="btn-secondary" style="min-width: 100px; display: none;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="modal-overlay" id="customToast" style="display: none; align-items: flex-end; justify-content: center; background: transparent; pointer-events: none;">
        <div class="modal-content" style="max-width: 300px; margin-bottom: 20px; text-align: center;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="toastIcon" style="font-size: 1.2rem;"></span>
                <p id="toastMessage" style="margin: 0; font-size: 0.9rem;"></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
    <script src="/utils/sw-manager.js"></script>

    <!-- Mobile Detection -->
    <script>
        function isMobileChrome() {
            const ua = navigator.userAgent;
            return (/Android/i.test(ua) && /Chrome/i.test(ua) && !/Edg/i.test(ua));
        }
        
        function applyChromeMobileFixes() {
            if (isMobileChrome()) {
                document.body.classList.add('chrome-mobile');
                let vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
                window.addEventListener('resize', () => {
                    let vh = window.innerHeight * 0.01;
                    document.documentElement.style.setProperty('--vh', `${vh}px`);
                });
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyChromeMobileFixes);
        } else {
            applyChromeMobileFixes();
        }
        
        function fixImgBBUrls(url) {
            if (isMobileChrome() && url && url.includes('ibb.co')) {
                url = url.replace('https://ibb.co/', 'https://i.ibb.co/');
                if (!url.includes('.jpg') && !url.includes('.png') && !url.includes('.gif')) {
                    url += '.jpg';
                }
            }
            return url;
        }
        
        window.fixImgBBUrls = fixImgBBUrls;
        window.isMobileChrome = isMobileChrome;
    </script>
</body>
</html>
