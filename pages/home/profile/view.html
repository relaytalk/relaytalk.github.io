<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Profile · RelayTalk</title>

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'
        https://kponqaktavkrchebmiwr.supabase.co
        https://api.supabase.com
        https://api.imgbb.com
        https://*.ibb.co
        https://i.ibb.co
        https://*.github.io
        https://github.com
        https://fonts.googleapis.com
        https://cdnjs.cloudflare.com;

        script-src 'self' 'unsafe-inline' 'unsafe-eval'
        https://kponqaktavkrchebmiwr.supabase.co
        https://cdn.jsdelivr.net
        https://fonts.googleapis.com
        https://i.ibb.co
        https://cdnjs.cloudflare.com;

        style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com
        https://cdn.jsdelivr.net
        https://fonts.gstatic.com
        https://cdnjs.cloudflare.com;

        img-src 'self' data: blob:
        https://*.ibb.co
        https://i.ibb.co
        https://*.imgbb.com
        https:;

        font-src 'self' data:
        https://fonts.gstatic.com
        https://cdn.jsdelivr.net
        https://cdnjs.cloudflare.com;

        connect-src 'self'
        https://kponqaktavkrchebmiwr.supabase.co
        wss://kponqaktavkrchebmiwr.supabase.co
        https://api.supabase.com
        https://api.imgbb.com
        https://*.github.io
        https://i.ibb.co
        https://cdn.jsdelivr.net
        https://cdnjs.cloudflare.com;

        worker-src 'self' blob:;
        media-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-src 'none';
    ">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="view.css">

    <link rel="icon" href="/favicon.ico">
    <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/relay.png">
</head>
<body>
    <div class="view-loading" id="loadingIndicator">
        <div class="loading-visual">
            <div class="loading-ring ring-1"></div>
            <div class="loading-ring ring-2"></div>
            <div class="loading-ring ring-3"></div>
            <div class="loading-core"></div>
        </div>
        <div class="loading-text">Loading<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>

    <div class="view-fallback" id="fallbackScreen" style="display: none;">
        <div class="fallback-card">
            <div class="fallback-emoji">🔎</div>
            <h2 class="fallback-title">Account not found</h2>
            <p class="fallback-message">This account does not exist or may have been removed.</p>
            <div class="fallback-actions">
                <a href="../../home/index.html" class="fallback-btn primary">Go to Home</a>
            </div>
        </div>
    </div>

    <header class="app-bar">
        <div class="app-bar-inner">
            <button class="icon-btn back-btn" onclick="closeView()" aria-label="Close">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="app-bar-brand">
                <img src="/relay.png" alt="RelayTalk" class="brand-logo-img">
                <span class="brand-name">Profile</span>
            </div>
            <div class="app-bar-actions"></div>
        </div>
    </header>

    <main class="view-main" id="viewMain" style="display: none;">
        <div class="view-avatar-wrap">
            <div class="view-avatar" id="viewAvatar">
                <span class="view-avatar-initial" id="viewAvatarInitial">?</span>
                <img id="viewAvatarImg" src="" alt="" style="display: none;">
            </div>
        </div>

        <h1 class="view-name" id="viewName">User</h1>
        <div class="view-username" id="viewUsername">@username</div>

        <div class="view-status-pill" id="viewStatusPill">
            <span class="view-status-dot" id="viewStatusDot"></span>
            <span class="view-status-text" id="viewStatusText">Offline</span>
        </div>

        <div class="view-actions">
            <button class="view-action-btn view-action-message" onclick="openChat()">
                <i class="fas fa-comment-dots"></i>
                <span>Message</span>
            </button>
            <button class="view-action-btn view-action-call" onclick="startCallFromView()">
                <i class="fas fa-phone"></i>
                <span>Call</span>
            </button>
        </div>

        <div class="view-bio-section">
            <div class="view-bio-label">Biography</div>
            <div class="view-bio-box" id="viewBioBox">
                <span class="view-bio-empty">No biography yet.</span>
            </div>
        </div>

        <div class="view-friends-since" id="viewFriendsSince"></div>
    </main>

    <div class="view-toast" id="viewToast" style="display: none;">
        <span id="viewToastIcon">✅</span>
        <span id="viewToastText">Message</span>
    </div>

    <script type="module" src="../../../utils/supabase.js"></script>
    <script type="module" src="view.js"></script>
    <script type="module" src="/utils/callHub.js"></script>
</body>
</html>
