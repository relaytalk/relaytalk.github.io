<body>

    <!-- Header -->
    <header class="friends-header">
        <div class="header-content">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='../../home/index.html'">

            </div>

    <!-- Search Bar -->
    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" 
                   id="searchInput" 
                   class="search-input" 
                   placeholder="Search friends..." 
                   autocomplete="off"
                   oninput="searchFriends()">
            <button class="clear-search" id="clearSearch" onclick="clearSearch()" style="display: none;">

    <!-- Friends List -->

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="../../home/index.html" class="nav-item">

    </nav>

    <!-- Add Friends Modal -->
    <div class="modal-overlay" id="searchModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-user-plus" style="color:#f5b342;"></i> Add Friends</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="search-input-container">
                    <i class="fas fa-search"></i>
                    <input type="text" 
                           id="userSearchInput" 
                           placeholder="Search by username..." 
                           autocomplete="off"
                           oninput="searchUsers()">
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script type="module">
        import { initializeSupabase } from '../../call-app/utils/supabase.js'
        import { 
            getRelayTalkUser, 
            syncUserToDatabase, 
            getUserFriends,
            updateUserStatus,
            searchAllUsers,
            sendFriendRequest
        } from '../../call-app/utils/userSync.js'
        import { initCallListener } from '../../call-app/utils/callListener.js'
        
        let supabase
        let currentUser
        let friends = []
        let allFriends = []
        let incomingCallData = null
        
        async function init() {
            showLoading(true, 'Loading friends...')
            
            try {
                // 1. Get user from RelayTalk
                const user = getRelayTalkUser()
                if (!user) {
                    showError('Please login to RelayTalk first')
                    return
                }
                
                console.log('✅ Got user from RelayTalk:', user.email)
                
                // 2. Initialize Supabase
                supabase = await initializeSupabase()
                
                // 3. Sync user to database
                currentUser = await syncUserToDatabase(supabase, user)
                console.log('✅ User synced')
                
                // 4. Load friends
                await loadFriends()
                
                // 5. Initialize call listener with incoming call handler
                initCallListener(supabase, currentUser, {
                    onIncomingCall: (callData) => {
                        console.log('📞 Incoming call received:', callData)
                        incomingCallData = callData
                        showIncomingCallModal(callData)
                    }
                })
                
                // 6. Hide loading
                showLoading(false)
                
                // 7. Update status periodically
                setInterval(() => {
                    updateUserStatus(supabase, currentUser.id, 'online')
                }, 30000)
                
            } catch (error) {
                console.error('❌ Init error:', error)
                showError('Failed to initialize: ' + error.message)
            }
        }
        
        async function loadFriends() {
            friends = await getUserFriends(supabase, currentUser.id)
            allFriends = [...friends]
            console.log(`✅ Loaded ${friends.length} friends`)
            renderFriendsList()
        }
        
        function renderFriendsList() {
            const container = document.getElementById('friendsList')
            
            if (!friends || friends.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users" style="font-size: 48px; color: #f5b342; margin-bottom: 16px;"></i>
                        <h3 style="margin-bottom: 8px;">No friends yet</h3>
                        <p style="color: #666; margin-bottom: 20px;">Add friends to start calling</p>
                        <button onclick="openSearch()" class="primary-btn" style="background: #f5b342; color: #333; padding: 12px 24px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer;">
                            <i class="fas fa-user-plus"></i> Add Friends
                        </button>
                    </div>
                `
                return
            }
            
            let html = ''
            friends.forEach(friend => {
                const online = friend.status === 'online'
                const lastSeen = friend.last_seen ? formatLastSeen(friend.last_seen) : 'Offline'
                
                html += `
                    <div class="friend-item">
                        <div class="friend-avatar">
                            ${friend.avatar_url 
                                ? `<img src="${friend.avatar_url}" alt="${friend.username}">`
                                : `<span>${friend.username.charAt(0).toUpperCase()}</span>`
                            }
                            <span class="status-indicator ${online ? 'online' : 'offline'}"></span>
                        </div>
                        <div class="friend-info">
                            <div class="friend-name">${friend.username}</div>
                            <div class="friend-status-text">${online ? 'Online' : lastSeen}</div>
                        </div>
                        <button class="call-btn" onclick="startCall('${friend.id}', '${friend.username}')">
                            <i class="fas fa-phone"></i>
                        </button>
                    </div>
                `
            })
            
            container.innerHTML = html
        }
        
        window.searchFriends = function() {
            const term = document.getElementById('searchInput').value.toLowerCase()
            const clearBtn = document.getElementById('clearSearch')
            
            if (term) {
                clearBtn.style.display = 'block'
                friends = allFriends.filter(f => 
                    f.username.toLowerCase().includes(term)
                )
            } else {
                clearBtn.style.display = 'none'
                friends = [...allFriends]
            }
            
            renderFriendsList()
        }
        
        window.clearSearch = function() {
            document.getElementById('searchInput').value = ''
            document.getElementById('clearSearch').style.display = 'none'
            friends = [...allFriends]
            renderFriendsList()
        }
        
        window.openSearch = function() {
            document.getElementById('searchModal').style.display = 'flex'
            document.getElementById('userSearchInput').focus()
        }
        
        window.closeModal = function() {
            document.getElementById('searchModal').style.display = 'none'
            document.getElementById('userSearchInput').value = ''
            document.getElementById('searchResults').innerHTML = ''
        }
        
        window.searchUsers = async function() {
            const term = document.getElementById('userSearchInput').value.toLowerCase()
            
            if (term.length < 2) {
                document.getElementById('searchResults').innerHTML = ''
                return
            }
            
            try {
                const users = await searchAllUsers(supabase, term, currentUser.id)
                displaySearchResults(users)
            } catch (error) {
                console.error('Search error:', error)
            }
        }
        
        function displaySearchResults(users) {
            const resultsDiv = document.getElementById('searchResults')
            
            if (users.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="empty-search">
                        <p>No users found</p>
                    </div>
                `
                return
            }
            
            let html = ''
            users.forEach(user => {
                const isFriend = friends.some(f => f.id === user.id)
                
                html += `
                    <div class="search-result-item">
                        <div class="result-avatar" style="background: #f5b342;">
                            ${user.avatar_url 
                                ? `<img src="${user.avatar_url}" alt="${user.username}">`
                                : `<span>${user.username.charAt(0).toUpperCase()}</span>`
                            }
                        </div>
                        <div class="result-info">
                            <div class="result-name">${user.username}</div>
                            <div class="result-email">${user.email || ''}</div>
                        </div>
                        ${!isFriend ? `
                            <button class="add-friend-btn" onclick="addFriend('${user.id}')">
                                <i class="fas fa-user-plus"></i>
                            </button>
                        ` : `
                            <span class="friend-badge">Friend</span>
                        `}
                    </div>
                `
            })
            
            resultsDiv.innerHTML = html
        }
        
        window.addFriend = async function(userId) {
            try {
                await sendFriendRequest(supabase, currentUser.id, userId)
                showToast('Friend request sent!', 'success')
                closeModal()
            } catch (error) {
                showToast(error.message, 'error')
            }
        }
        
        window.startCall = function(friendId, friendName) {
            // Check if friend is online
            const friend = friends.find(f => f.id === friendId)
            if (!friend || friend.status !== 'online') {
                showToast(`${friendName} is offline`, 'error')
                return
            }
            
            // Redirect to call page with correct path
            window.location.href = `../../call-app/pages/call/index.html?friendId=${friendId}&friendName=${encodeURIComponent(friendName)}`
        }
        
        function showIncomingCallModal(callData) {
            const modal = document.getElementById('incomingCallModal')
            const callerNameEl = document.getElementById('callerName')
            const callerInitialEl = document.getElementById('callerInitial')
            
            // Find caller in friends list or create temp display
            const caller = friends.find(f => f.id === callData.callerId) || { username: 'Unknown Caller' }
            
            callerNameEl.textContent = caller.username
            callerInitialEl.textContent = caller.username.charAt(0).toUpperCase()
            
            modal.style.display = 'flex'
            
            // Play ringtone
            playRingtone()
        }
        
        window.acceptCall = function() {
            if (!incomingCallData) return
            
            stopRingtone()
            document.getElementById('incomingCallModal').style.display = 'none'
            
            // Redirect to call page with incoming call parameters
            const url = `../../call-app/pages/call/index.html?incoming=true&room=${incomingCallData.room}&callerId=${incomingCallData.callerId}&callId=${incomingCallData.callId}`
            window.location.href = url
        }
        
        window.rejectCall = function() {
            stopRingtone()
            document.getElementById('incomingCallModal').style.display = 'none'
            
            // You can add API call to reject call here
            if (incomingCallData?.callId) {
                // Call reject API
                console.log('Call rejected:', incomingCallData.callId)
            }
            
            incomingCallData = null
        }
        
        // Simple ringtone using Web Audio API
        let audioContext = null
        let oscillator = null
        let gainNode = null
        let ringtoneInterval = null
        
        function playRingtone() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)()
                oscillator = audioContext.createOscillator()
                gainNode = audioContext.createGain()
                
                oscillator.connect(gainNode)
                gainNode.connect(audioContext.destination)
                
                oscillator.type = 'sine'
                oscillator.frequency.value = 440
                
                gainNode.gain.value = 0.5
                
                oscillator.start()
                
                // Create ring pattern
                let isOn = true
                ringtoneInterval = setInterval(() => {
                    if (!audioContext) {
                        clearInterval(ringtoneInterval)
                        return
                    }
                    gainNode.gain.value = isOn ? 0.5 : 0
                    isOn = !isOn
                }, 500)
                
            } catch (e) {
                console.log('Ringtone not supported:', e)
            }
        }
        
        function stopRingtone() {
            if (ringtoneInterval) {
                clearInterval(ringtoneInterval)
                ringtoneInterval = null
            }
            if (oscillator) {
                try {
                    oscillator.stop()
                    oscillator.disconnect()
                } catch (e) {}
                oscillator = null
            }
            if (audioContext) {
                try {
                    audioContext.close()
                } catch (e) {}
                audioContext = null
            }
        }
        
        function formatLastSeen(timestamp) {
            const now = new Date()
            const time = new Date(timestamp)
            const diff = Math.floor((now - time) / 60000)
            
            if (diff < 1) return 'Just now'
            if (diff < 60) return `${diff}m ago`
            if (diff < 1440) return `${Math.floor(diff / 60)}h ago`
            return time.toLocaleDateString()
        }
        
        function showLoading(show, text) {
            const loader = document.getElementById('loadingIndicator')
            if (loader) {
                loader.style.display = show ? 'flex' : 'none'
                if (text) document.getElementById('loadingText').textContent = text
            }
        }
        
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer')
            const toast = document.createElement('div')
            toast.className = `toast ${type}`
            toast.textContent = message
            container.appendChild(toast)
            
            setTimeout(() => {
                toast.remove()
            }, 3000)
        }
        
        function showError(message) {
            showLoading(false)
            document.getElementById('friendsList').innerHTML = `
                <div class="error-container" style="text-align: center; padding: 40px;">
                    <i class="fas fa-exclamation-circle" style="font-size: 48px; color: #f5b342; margin-bottom: 16px;"></i>
                    <h3 style="margin-bottom: 8px;">Error</h3>
                    <p style="color: #666; margin: 16px 0;">${message}</p>
                    <button onclick="window.location.href='../../home/index.html'" class="primary-btn" style="background: #f5b342; color: #333; padding: 12px 24px; border: none; border-radius: 25px; cursor: pointer;">
                        Go to Home
                    </button>
                </div>
            `
        }
        
        // Start the app
        init()
    </script>
</body>
</html>
