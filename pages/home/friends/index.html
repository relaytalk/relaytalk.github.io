<style>
    /* ... existing styles ... */
    
    /* Modern Mobile-Style Incoming Call Notification */
    .incoming-call-notification {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.95);
        backdrop-filter: blur(10px);
        color: white;
        padding: 20px;
        z-index: 10000;
        animation: slideDown 0.3s ease;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    @keyframes slideDown {
        from {
            transform: translateY(-100%);
        }
        to {
            transform: translateY(0);
        }
    }

    .incoming-call-content {
        display: flex;
        align-items: center;
        gap: 16px;
        max-width: 400px;
        margin: 0 auto;
    }

    .incoming-call-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #007acc, #00b4d8);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        font-weight: bold;
        box-shadow: 0 4px 12px rgba(0,122,204,0.3);
    }

    .incoming-call-avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
    }

    .incoming-call-info {
        flex: 1;
    }

    .incoming-call-name {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 4px;
        color: white;
    }

    .incoming-call-status {
        font-size: 14px;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .pulsing-dot {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% {
            opacity: 1;
            transform: scale(1);
        }
        50% {
            opacity: 0.5;
            transform: scale(1.2);
        }
        100% {
            opacity: 1;
            transform: scale(1);
        }
    }

    .incoming-call-actions {
        display: flex;
        gap: 12px;
    }

    .incoming-call-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .incoming-call-btn.accept {
        background: #22c55e;
        color: white;
        box-shadow: 0 4px 12px rgba(34,197,94,0.3);
    }

    .incoming-call-btn.accept:hover {
        background: #16a34a;
        transform: scale(1.1);
    }

    .incoming-call-btn.decline {
        background: #ef4444;
        color: white;
        box-shadow: 0 4px 12px rgba(239,68,68,0.3);
    }

    .incoming-call-btn.decline:hover {
        background: #dc2626;
        transform: scale(1.1);
    }

    /* For iOS-style bottom sheet on mobile */
    @media (max-width: 480px) {
        .incoming-call-notification {
            top: auto;
            bottom: 0;
            border-bottom: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        
        .incoming-call-content {
            padding: 10px 0;
        }
    }
</style>
