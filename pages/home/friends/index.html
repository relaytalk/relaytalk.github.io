    <style>
        /* Connection status */
        .connection-status {
            position: fixed;
            top: 60px;
            right: 10px;
            z-index: 1000;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            pointer-events: none;
            animation: slideIn 0.3s ease;
        }

        .connection-status.connected {
            background: rgba(0, 200, 0, 0.2);
            border-color: rgba(0, 255, 0, 0.3);
        }

        .connection-status.error {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.3);
        }

        .status-dot-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot-indicator.connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .status-dot-indicator.error {
            background: #ff0000;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============================================ */
        /* NOTIFICATIONS MODAL - TWO TABS               */
        /* ============================================ */
        .notif-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            padding: 6px;
            background: rgba(0, 122, 204, 0.06);
            border-radius: 14px;
            border: 1px solid rgba(0, 122, 204, 0.15);
        }

        .notif-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .notif-tab i { font-size: 1rem; }

        .notif-tab:hover {
            color: #007acc;
            background: rgba(0, 122, 204, 0.05);
        }

        .notif-tab.active {
            background: white;
            color: #007acc;
            box-shadow: 0 2px 8px rgba(0, 122, 204, 0.15);
        }

        .notif-tab-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            background: linear-gradient(135deg, #ff6b8b, #ff8e53);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 10px;
            margin-left: 4px;
            border: 1.5px solid white;
        }

        .notif-tab-content { display: none; }
        .notif-tab-content.active { display: block; animation: fadeIn 0.2s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Call history items */
        .call-history-date {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            margin: 16px 0 8px;
            padding-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .call-history-date:first-child { margin-top: 0; }

        .call-history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: white;
            border-radius: 14px;
            margin-bottom: 8px;
            border: 1px solid rgba(0, 122, 204, 0.12);
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .call-history-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: #94a3b8;
        }

        .call-history-item.status-answered::before { background: #22c55e; }
        .call-history-item.status-missed::before { background: #ef4444; }
        .call-history-item.status-rejected::before { background: #f59e0b; }
        .call-history-item.status-cancelled::before { background: #94a3b8; }
        .call-history-item.status-ringing::before { background: #f59e0b; }

        .call-history-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(45deg, #007acc, #00b4d8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .call-history-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .call-history-info { flex: 1; min-width: 0; }

        .call-history-name {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .call-history-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .call-history-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .call-history-status.status-answered { background: rgba(34, 197, 94, 0.12); color: #16a34a; }
        .call-history-status.status-missed { background: rgba(239, 68, 68, 0.12); color: #dc2626; }
        .call-history-status.status-rejected { background: rgba(245, 158, 11, 0.12); color: #d97706; }
        .call-history-status.status-cancelled { background: rgba(148, 163, 184, 0.15); color: #64748b; }
        .call-history-status.status-ringing { background: rgba(245, 158, 11, 0.12); color: #d97706; }
    </style>
</head>
<body>
    <div id="connectionStatus" class="connection-status" style="display: none;">
        <span class="status-dot-indicator"></span>
        <span class="status-text">Connecting...</span>
    </div>

    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-spinner"></div>
        <div class="loading-text">Connecting to server...</div>
        <div class="loading-subtext">This will just take a moment</div>
    </div>

    <header class="friends-header">
        <div class="header-content">
            <div class="header-left">
                <button class="back-btn" onclick="goToHome()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h1 class="header-title">Friends</h1>
            </div>
            <div class="header-actions"></div>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text"
                   id="searchInput"
                   class="search-input"
                   placeholder="Search friends..."
                   autocomplete="off"
                   oninput="searchFriends()">
            <button class="clear-search" id="clearSearch" onclick="clearSearch()" style="display: none;">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <main class="friends-list" id="friendsList"></main>

    <!-- Bottom Navigation - with Notifications between Home and Friends -->
    <nav class="bottom-nav">
        <a href="../../home/index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>

        <a href="#" class="nav-item" onclick="openNotifications(event)">
            <i class="fas fa-bell"></i>
            <span>Notifications</span>
            <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
        </a>

        <a href="#" class="nav-item active">
            <i class="fas fa-users"></i>
            <span>Friends</span>
        </a>

        <a href="../profile/index.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Notifications Modal with Two Tabs -->
    <div class="modal-overlay" id="notificationsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title"><i class="fas fa-bell"></i> Notifications</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>

            <div class="notif-tabs">
                <button class="notif-tab active" id="notifTabMain" onclick="switchNotifTab('main')">
                    <i class="fas fa-bell"></i>
                    Main
                    <span class="notif-tab-badge" id="mainTabBadge" style="display: none;">0</span>
                </button>
                <button class="notif-tab" id="notifTabCalls" onclick="switchNotifTab('calls')">
                    <i class="fas fa-phone"></i>
                    Calls
                    <span class="notif-tab-badge" id="callsTabBadge" style="display: none;">0</span>
                </button>
            </div>

            <div class="notif-tab-content active" id="notifMainContent">
                <div id="notificationsList"></div>
            </div>

            <div class="notif-tab-content" id="notifCallsContent">
                <div id="callHistoryList"></div>
            </div>
        </div>
    </div>

    <!-- Add Friends modal (kept for compat) -->
    <div class="modal-overlay" id="searchModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-user-plus" style="color:#007acc;"></i> Add Friends</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="search-input-container">
                    <i class="fas fa-search"></i>
                    <input type="text"
                           id="userSearchInput"
                           placeholder="Search by username..."
                           autocomplete="off"
                           oninput="searchUsers()">
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <audio id="incomingRingtone" loop preload="auto" style="display: none;">
        <source src="../../../assets/ringtones/incoming.mp3" type="audio/mpeg">
    </audio>
    <audio id="outgoingRingtone" loop preload="auto" style="display: none;">
        <source src="../../../assets/ringtones/ringing.mp3" type="audio/mpeg">
    </audio>

    <link rel="modulepreload" href="../../../utils/supabase.js">
    <link rel="modulepreload" href="friends.js">
    <script type="module" src="../../../utils/supabase.js"></script>
    <script type="module" src="friends.js"></script>

    <!-- Global call hub - incoming call banner -->
    <script type="module" src="/utils/callHub.js"></script>

    <script>
        window.goToHome = function() {
            window.location.href = '../../home/index.html';
        };

        window.openChat = function(friendId, friendName) {
            sessionStorage.setItem('currentChatFriend', JSON.stringify({
                id: friendId,
                username: friendName
            }));
            window.location.href = `../../chats/index.html?friendId=${friendId}`;
        };

        window.closeModal = function() {
            document.getElementById('searchModal').style.display = 'none';
            document.getElementById('notificationsModal').style.display = 'none';
        };
    </script>
</body>
