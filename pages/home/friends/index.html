<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Friends · RelayTalk</title>
    <meta name="google-site-verification" content="y2KUdk5NLGrxUgulLoxvA0a2y3jQlVPObdNtYkIef2U" />
    
    <!-- Styles - ONLY friends.css + font awesome -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="friends.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-spinner"></div>
        <div>Loading friends...</div>
    </div>

    <!-- INCOMING CALL MODAL - NEW with friends theme -->
    <div class="modal-overlay" id="incomingCallModal" style="display: none;">
        <div class="modal-content incoming-call">
            <div class="incoming-call-header">
                <i class="fas fa-phone-alt" style="font-size: 48px; color: #007acc; animation: ring 1s infinite;"></i>
                <h2>Incoming Call</h2>
            </div>
            <div class="caller-info" id="callerInfo">
                <div class="caller-avatar" id="callerAvatar" style="background: linear-gradient(45deg, #007acc, #00b4d8);">
                    <span id="callerInitial"></span>
                </div>
                <div class="caller-details">
                    <div class="caller-name" id="callerName">Loading...</div>
                    <div class="call-status">Calling...</div>
                </div>
            </div>
            <div class="call-actions">
                <button class="call-action-btn decline" onclick="rejectCall()">
                    <i class="fas fa-times"></i>
                    <span>Decline</span>
                </button>
                <button class="call-action-btn accept" onclick="acceptCall()">
                    <i class="fas fa-phone"></i>
                    <span>Accept</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Header - FRIENDS STYLE (unchanged) -->
    <header class="friends-header">
        <div class="header-content">
            <div class="header-left">
                <button class="back-btn" onclick="goToHome()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h1 class="header-title">Friends</h1>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="openSearch()">
                    <i class="fas fa-user-plus"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Search Bar - FRIENDS STYLE (unchanged) -->
    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" 
                   id="searchInput" 
                   class="search-input" 
                   placeholder="Search friends..." 
                   autocomplete="off"
                   oninput="searchFriends()">
            <button class="clear-search" id="clearSearch" onclick="clearSearch()" style="display: none;">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Friends List - FRIENDS STYLE (unchanged) -->
    <main class="friends-list" id="friendsList"></main>

    <!-- Bottom Navigation - FRIENDS STYLE (unchanged) -->
    <nav class="bottom-nav">
        <a href="../../home/index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item active">
            <i class="fas fa-users"></i>
            <span>Friends</span>
        </a>
        <a href="../profile/index.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Add Friends Modal - FRIENDS STYLE (unchanged) -->
    <div class="modal-overlay" id="searchModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-user-plus" style="color:#007acc;"></i> Add Friends</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="search-input-container">
                    <i class="fas fa-search"></i>
                    <input type="text" 
                           id="userSearchInput" 
                           placeholder="Search by username..." 
                           autocomplete="off"
                           oninput="searchUsers()">
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>

    <!-- Toast Container - FRIENDS STYLE -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts - UPDATED imports for call functionality -->
    <script type="module" src="../../utils/supabase.js"></script>
    <script type="module" src="friends.js"></script>
</body>
</html>
