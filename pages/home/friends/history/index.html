<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Call History · RelayTalk</title>
    
    <!-- DNS Prefetch for Cloudflare Worker -->
    <link rel="preconnect" href="https://relaytalk-proxy.lusterchat.workers.dev" crossorigin>
    <link rel="dns-prefetch" href="https://relaytalk-proxy.lusterchat.workers.dev">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="history.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Indicator -->
    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-spinner"></div>
        <div>Loading history...</div>
    </div>

    <!-- Header -->
    <header class="history-header">
        <div class="header-content">
            <button class="back-btn" onclick="goToFriends()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="header-title">Call History</h1>
            <button class="clear-btn" onclick="clearHistory()" style="visibility: hidden;">Clear</button>
        </div>
    </header>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
        <button class="filter-btn active" onclick="filterHistory('all')" id="filterAll">All</button>
        <button class="filter-btn" onclick="filterHistory('missed')" id="filterMissed">Missed</button>
    </div>

    <!-- History List -->
    <main class="history-list" id="historyList">
        <!-- History items will be loaded here -->
        <div class="empty-history" id="emptyHistory" style="display: none;">
            <i class="fas fa-history" style="font-size: 48px; color: #94a3b8; margin-bottom: 16px;"></i>
            <h3>No call history</h3>
            <p>Your call history will appear here</p>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="../../../home/index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="../index.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Friends</span>
        </a>
        <a href="#" class="nav-item active">
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>
        <a href="../../profile/index.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script type="module" src="../../../../utils/supabase.js"></script>
    <script type="module" src="history.js"></script>
</body>
</html>
