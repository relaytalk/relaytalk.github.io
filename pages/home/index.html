    <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'
        https://kponqaktavkrchebmiwr.supabase.co

        script-src 'self' 'unsafe-inline' 'unsafe-eval'
        https://kponqaktavkrchebmiwr.supabase.co
        https://cdn.jsdelivr.net

        https://i.ibb.co
        https://cdnjs.cloudflare.com;

        style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com
        https://cdn.jsdelivr.net

        img-src 'self' data: blob:
        https://*.ibb.co
        https://i.ibb.co
        https://*.imgbb.com
        https:;

        font-src 'self' data:
        https://fonts.gstatic.com
        https://cdn.jsdelivr.net
        https://cdnjs.cloudflare.com;

        connect-src 'self'
        https://kponqaktavkrchebmiwr.supabase.co
        wss://kponqaktavkrchebmiwr.supabase.co
        https://api.supabase.com
        https://api.imgbb.com
        https://*.github.io

        https://cdnjs.cloudflare.com;

        worker-src 'self' blob:;

        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-src 'none';
    ">

    <script>
        (function() {
            try {
                let hasSession = false;
                const localToken = localStorage.getItem('supabase.auth.token');
                const sessionToken = sessionStorage.getItem('supabase.auth.token');
                hasSession = !!(localToken || sessionToken);

                if (!hasSession) {
                    try {
                        const persistedSession = localStorage.getItem('supabase.auth.token');
                        if (persistedSession && persistedSession.includes('access_token')) {
                            hasSession = true;
                        }
                    } catch (e) {}
                }

                if (!hasSession) {
                    window.location.replace('/');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-spinner"></div>
    </div>

    <!-- Top App Bar -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <div class="app-bar-brand">
                <span class="brand-logo">R</span>
                <span class="brand-name">RelayTalk</span>
            </div>
            <div class="app-bar-actions">
                <button class="icon-btn" onclick="openSearch()" aria-label="Search">
                    <i class="fas fa-search"></i>
                </button>
                <button class="icon-btn" onclick="openNotifications()" aria-label="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="app-bar-badge" id="notificationBadge" style="display: none;">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="page">
        <!-- Greeting -->
        <section class="greeting">
            <p class="greeting-small" id="greetingSmall">Hello</p>
            <h1 class="greeting-title" id="welcomeTitle">Friend</h1>
            <p class="greeting-sub">Welcome back to RelayTalk</p>
        </section>

        <!-- Primary action -->
        <button class="primary-action" onclick="openSearch()">
            <span class="primary-action-icon">
                <i class="fas fa-user-plus"></i>
            </span>
            <span class="primary-action-text">
                <span class="primary-action-title">Find friends</span>
                <span class="primary-action-desc">Search by username</span>
            </span>
            <span class="primary-action-chevron">
                <i class="fas fa-chevron-right"></i>
            </span>
        </button>

        <!-- Friends list -->
        <section class="section">
            <div class="section-head">
                <h2 class="section-title">Friends</h2>
                <button class="text-btn" onclick="viewFriendsPage()">View all</button>
            </div>
            <div class="list" id="friendsList"></div>
        </section>
    </main>

    <!-- Bottom Navigation (original icons restored) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="goToHome(); return false;">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="openNotifications(); return false;">
            <i class="fas fa-bell"></i>
            <span>Alerts</span>
            <span class="nav-badge" id="navNotificationBadge" style="display: none;">0</span>
        </a>
        <a href="#" class="nav-item" onclick="viewFriendsPage(); return false;">
            <i class="fas fa-user-friends"></i>
            <span>Friends</span>
        </a>
        <a href="profile/index.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>You</span>
        </a>
    </nav>

    <!-- Search Modal -->
    <div class="modal" id="searchModal">
        <div class="modal-panel">
            <div class="modal-head">
                <h2 class="modal-title">Find people</h2>
                <button class="modal-close" onclick="closeModal()" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="search-wrap">
                    <i class="fas fa-search search-svg"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by username" autocomplete="off" spellcheck="false">
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div class="modal" id="notificationsModal">
        <div class="modal-panel">
            <div class="modal-head">
                <h2 class="modal-title">Notifications</h2>
                <button class="modal-close" onclick="closeModal()" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="tabs" role="tablist">
                    <button class="tab active" id="notifTabMain" onclick="switchNotifTab('main')">
                        <i class="fas fa-user-plus tab-icon"></i>
                        Requests
                        <span class="tab-badge" id="mainTabBadge" style="display: none;">0</span>
                    </button>
                    <button class="tab" id="notifTabCalls" onclick="switchNotifTab('calls')">
                        <i class="fas fa-phone tab-icon"></i>
                        Calls
                        <span class="tab-badge" id="callsTabBadge" style="display: none;">0</span>
                    </button>
                </div>

                <div class="tab-content active" id="notifMainContent">
                    <div id="notificationsList"></div>
                </div>

                <div class="tab-content" id="notifCallsContent">
                    <div id="callHistoryList"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script src="/utils/sw-manager.js"></script>
    <script type="module" src="/utils/callHub.js"></script>
</body>
</html>
