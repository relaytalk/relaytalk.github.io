    <script>
        (function() {
            try {
                let hasSession = false;
                const localToken = localStorage.getItem('supabase.auth.token');
                const sessionToken = sessionStorage.getItem('supabase.auth.token');
                hasSession = !!(localToken || sessionToken);

                if (!hasSession) {
                    try {
                        const persistedSession = localStorage.getItem('supabase.auth.token');
                        if (persistedSession && persistedSession.includes('access_token')) {
                            hasSession = true;
                        }
                    } catch (e) {}
                }

                if (!hasSession) {
                    window.location.replace('/');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-spinner"></div>
    </div>

    <!-- Top App Bar -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <div class="app-bar-brand">RelayTalk</div>
            <div class="app-bar-actions">
                <button class="icon-btn" onclick="openSearch()" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                <button class="icon-btn" onclick="openNotifications()" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="app-bar-badge" id="notificationBadge" style="display: none;">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="page">
        <!-- Greeting -->
        <section class="greeting">
            <h1 class="greeting-title" id="greetingTitle">Hello</h1>
            <p class="greeting-sub" id="greetingSub">Welcome back to RelayTalk</p>
        </section>

        <!-- Primary action -->
        <button class="primary-action" onclick="openSearch()">
            <span class="primary-action-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="8.5" cy="7" r="4"/>
                    <line x1="20" y1="8" x2="20" y2="14"/>
                    <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
            </span>
            <span class="primary-action-text">
                <span class="primary-action-title">Find friends</span>
                <span class="primary-action-desc">Search by username</span>
            </span>
            <span class="primary-action-chevron">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </span>
        </button>

        <!-- Friends list -->
        <section class="section">
            <div class="section-head">
                <h2 class="section-title">Friends</h2>
                <button class="text-btn" onclick="viewFriendsPage()">View all</button>
            </div>
            <div class="list" id="friendsList"></div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="goToHome(); return false;">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="openNotifications(); return false;">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span>Alerts</span>
            <span class="nav-badge" id="navNotificationBadge" style="display: none;">0</span>
        </a>
        <a href="#" class="nav-item" onclick="viewFriendsPage(); return false;">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Friends</span>
        </a>
        <a href="profile/index.html" class="nav-item">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>You</span>
        </a>
    </nav>

    <!-- Search Modal -->
    <div class="modal" id="searchModal">
        <div class="modal-panel">
            <div class="modal-head">
                <h2 class="modal-title">Find people</h2>
                <button class="modal-close" onclick="closeModal()" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="search-wrap">
                    <svg class="search-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by username" autocomplete="off" spellcheck="false">
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div class="modal" id="notificationsModal">
        <div class="modal-panel">
            <div class="modal-head">
                <h2 class="modal-title">Notifications</h2>
                <button class="modal-close" onclick="closeModal()" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="tabs" role="tablist">
                    <button class="tab active" id="notifTabMain" onclick="switchNotifTab('main')">
                        Requests
                        <span class="tab-badge" id="mainTabBadge" style="display: none;">0</span>
                    </button>
                    <button class="tab" id="notifTabCalls" onclick="switchNotifTab('calls')">
                        Calls
                        <span class="tab-badge" id="callsTabBadge" style="display: none;">0</span>
                    </button>
                </div>

                <div class="tab-content active" id="notifMainContent">
                    <div id="notificationsList"></div>
                </div>

                <div class="tab-content" id="notifCallsContent">
                    <div id="callHistoryList"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script src="/utils/sw-manager.js"></script>
    <script type="module" src="/utils/callHub.js"></script>
</body>
