    <script>
        (function() {
            try {
                let hasSession = false;
                const localToken = localStorage.getItem('supabase.auth.token');
                const sessionToken = sessionStorage.getItem('supabase.auth.token');
                hasSession = !!(localToken || sessionToken);

                if (!hasSession) {
                    try {
                        const persistedSession = localStorage.getItem('supabase.auth.token');
                        if (persistedSession && persistedSession.includes('access_token')) {
                            hasSession = true;
                        }
                    } catch (e) {}
                }

                if (!hasSession) {
                    console.log('🚫 No session - redirecting to root');
                    window.location.replace('/');
                }
            } catch (e) {
                console.log('Session check error:', e);
            }
        })();
    </script>
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading -->
    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Relay...</div>
    </div>

    <!-- Top Header -->
    <header class="top-header">
        <div class="header-content">
            <div class="header-greeting">
                <div class="greeting-small" id="greetingSmall">Hello</div>
                <div class="greeting-name" id="welcomeTitle">Welcome to RelayTalk!</div>
            </div>
            <button class="header-search-btn" onclick="openSearch()" aria-label="Search">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </header>

    <!-- Main -->
    <main class="main-content">
        <!-- Quick Actions -->
        <section class="quick-actions">
            <button class="quick-action-card" onclick="openSearch()">
                <span class="quick-action-icon">
                    <i class="fas fa-user-plus"></i>
                </span>
                <span class="quick-action-body">
                    <span class="quick-action-title">Find Friends</span>
                    <span class="quick-action-desc">Search by username</span>
                </span>
            </button>

            <button class="quick-action-card" onclick="viewFriendsPage()">
                <span class="quick-action-icon">
                    <i class="fas fa-users"></i>
                </span>
                <span class="quick-action-body">
                    <span class="quick-action-title">All Friends</span>
                    <span class="quick-action-desc">View your friends</span>
                </span>
            </button>

            <button class="quick-action-card" onclick="openNotifications()">
                <span class="quick-action-icon">
                    <i class="fas fa-bell"></i>
                </span>
                <span class="quick-action-body">
                    <span class="quick-action-title">Notifications</span>
                    <span class="quick-action-desc">Latest updates</span>
                </span>
            </button>
        </section>

        <!-- Friends Section -->
        <section class="friends-section">
            <div class="section-header">
                <h2 class="section-title">Your Friends</h2>
                <div class="section-header-right">
                    <span class="online-counter" id="onlineCounter">
                        <span class="online-dot"></span>
                        0 online
                    </span>
                    <button class="view-all-btn" onclick="viewFriendsPage()">
                        View All
                    </button>
                </div>
            </div>
            <div class="friends-grid" id="friendsList"></div>
        </section>
    </main>

    <!-- Bottom Navigation — same style as Profile page -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="goToHome(); return false;">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="openNotifications(); return false;">
            <i class="fas fa-bell"></i>
            <span>Notifications</span>
            <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
        </a>
        <a href="#" class="nav-item" onclick="viewFriendsPage(); return false;">
            <i class="fas fa-users"></i>
            <span>Friends</span>
        </a>
        <a href="profile/index.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Search Modal -->
    <div class="modal-overlay" id="searchModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Search Users</h2>
                <button class="modal-close" onclick="closeModal()" aria-label="Close">×</button>
            </div>
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by username..." autocomplete="off">
            </div>
            <div id="searchResults"></div>
        </div>
    </div>

    <!-- Notifications Modal - Two Tabs -->
    <div class="modal-overlay" id="notificationsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Notifications</h2>
                <button class="modal-close" onclick="closeModal()" aria-label="Close">×</button>
            </div>

            <div class="notif-tabs">
                <button class="notif-tab active" id="notifTabMain" onclick="switchNotifTab('main')">
                    <i class="fas fa-bell"></i>
                    Main
                    <span class="notif-tab-badge" id="mainTabBadge" style="display: none;">0</span>
                </button>
                <button class="notif-tab" id="notifTabCalls" onclick="switchNotifTab('calls')">
                    <i class="fas fa-phone"></i>
                    Calls
                    <span class="notif-tab-badge" id="callsTabBadge" style="display: none;">0</span>
                </button>
            </div>

            <div class="notif-tab-content active" id="notifMainContent">
                <div id="notificationsList"></div>
            </div>

            <div class="notif-tab-content" id="notifCallsContent">
                <div id="callHistoryList"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
    <script src="/utils/sw-manager.js"></script>
    <script type="module" src="/utils/callHub.js"></script>
</body>
</html>
