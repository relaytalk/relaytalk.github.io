<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RelayTalk | Login</title>
    <meta name="description" content="Sign in to RelayTalk — fast, private messaging with friends and family.">
    <meta name="theme-color" content="#f7f9fc">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <header class="login-header">
        <a href="../../index.html" class="login-header-logo">
            <img src="/relay.png" alt="RelayTalk" class="login-header-logo-img">
            <span>RelayTalk</span>
        </a>
        <a class="login-header-home" href="../../index.html">Back to home <i class="fas fa-arrow-up-right-from-square"></i></a>
    </header>

    <main class="login-container">
        <section class="login-title-section">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <span class="login-eyebrow">YOUR SPACE IS WAITING</span>
            <h1 class="login-title">Welcome back.</h1>
            <p class="login-subtitle">Sign in to pick up where your conversations left off.</p>
        </section>

        <form class="login-form" id="loginForm" method="post" action="#">
            <div class="form-group">
                <label class="form-label" for="loginUsername">
                    <span class="form-label-icon"><i class="far fa-user"></i></span>
                    Username
                </label>
                <input type="text" id="loginUsername" class="form-input"
                       placeholder="Enter your username" required
                       minlength="3" maxlength="20"
                       name="username" autocomplete="username">
                <div class="error-message" id="usernameError"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="loginPassword">
                    <span class="form-label-icon"><i class="fas fa-lock"></i></span>
                    Password
                </label>
                <div class="password-input">
                    <input type="password" id="loginPassword" class="form-input"
                           placeholder="Enter your password" required minlength="6"
                           name="password" autocomplete="current-password">
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="login-options">
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" name="remember">
                    <label for="rememberMe">Keep me signed in</label>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span>Sign in to RelayTalk</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="success-message" id="successMessage"></div>

        <div class="divider"><span>NEW TO RELAYTALK?</span></div>

        <div class="signup-link">
            <span>Make room for better conversations.</span>
            <a href="../auth/index.html">Create your free account <i class="fas fa-arrow-right"></i></a>
        </div>

        <div class="security-badges">
            <div class="badge"><i class="fas fa-lock"></i> Private</div>
            <div class="badge"><i class="fas fa-shield-halved"></i> Secure</div>
            <div class="badge"><i class="fas fa-bolt"></i> Instant</div>
        </div>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="login-loader"></div>
        <p class="loading-text">Signing you in…</p>
    </div>

    <script type="module" src="script.js"></script>
    <script src="/utils/native-init.js" defer></script>
</body>
</html>
