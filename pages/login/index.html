<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

    <title>RelayTalk | Login</title>
    <meta name="google-site-verification" content="y2KUdk5NLGrxUgulLoxvA0a2y3jQlVPObdNtYkIef2U" />

    <meta name="description" content="Login to RelayTalk — your private, secure messaging platform. Sign in to access chats, calls, and instant messaging with friends and family.">
    <meta name="keywords" content="RelayTalk login, RelayTalk sign in, secure messaging app, private chat login, encrypted messaging, chat app, instant messaging">
    <meta name="author" content="RelayTalk">
    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#007acc">

    <link rel="apple-touch-icon" sizes="180x180" href="https://relaytalk.vercel.app/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://relaytalk.vercel.app/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://relaytalk.vercel.app/favicon-16x16.png">
    <link rel="manifest" href="https://relaytalk.vercel.app/site.webmanifest">

    <meta property="og:type" content="website">
    <meta property="og:title" content="RelayTalk Login | Secure Private Messaging Platform">
    <meta property="og:description" content="Sign in to RelayTalk — secure, private messaging with friends, family, and colleagues.">
    <meta property="og:url" content="https://relaytalk.vercel.app/pages/login/">
    <meta property="og:image" content="https://relaytalk.vercel.app/relay-og-image.png">
    <meta property="og:site_name" content="RelayTalk">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RelayTalk Login | Secure Messaging App Sign In">
    <meta name="twitter:description" content="Login to RelayTalk for secure, private messaging. Group chats, voice and video calls.">
    <meta name="twitter:image" content="https://relaytalk.vercel.app/relay-twitter-card.png">
    <meta name="twitter:site" content="@relaytalk">

    <link rel="canonical" href="https://relaytalk.vercel.app/pages/login/">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "RelayTalk Login",
      "description": "Login page for RelayTalk secure messaging application",
      "url": "https://relaytalk.vercel.app/pages/login/"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">

    <meta name="application-name" content="RelayTalk">
    <meta name="apple-mobile-web-app-title" content="RelayTalk">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <!-- Header -->
    <header class="login-header">
        <a href="../../index.html" class="login-header-logo">
            <img src="/relay.png" alt="RelayTalk" class="login-header-logo-img">
            <span>RelayTalk</span>
        </a>
    </header>

    <!-- Login Container -->
    <main class="login-container">
        <div class="login-title-section">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to your RelayTalk account</p>
        </div>

        <form class="login-form" id="loginForm" method="post" action="#">
            <!-- Username -->
            <div class="form-group">
                <label class="form-label" for="loginUsername">
                    <span class="form-label-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    Username
                </label>
                <input type="text" id="loginUsername" class="form-input"
                       placeholder="Enter your username" required
                       minlength="3" maxlength="20"
                       name="username" autocomplete="username">
                <div class="error-message" id="usernameError"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="loginPassword">
                    <span class="form-label-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    Password
                </label>
                <div class="password-input">
                    <input type="password" id="loginPassword" class="form-input"
                           placeholder="Enter your password" required
                           minlength="6"
                           name="password" autocomplete="current-password">
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <!-- Remember Me -->
            <div class="login-options">
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" name="remember">
                    <label for="rememberMe">Remember me</label>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="login-btn" id="loginBtn">
                Sign In
            </button>
        </form>

        <!-- Success -->
        <div class="success-message" id="successMessage"></div>

        <!-- Divider -->
        <div class="divider">or</div>

        <!-- Sign up -->
        <div class="signup-link">
            Don't have a RelayTalk account?
            <a href="../auth/index.html">Create Free Account</a>
        </div>

        <!-- Security badges -->
        <div class="security-badges">
            <div class="badge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Private
            </div>
            <div class="badge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Secure
            </div>
            <div class="badge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                Instant
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="login-loader"></div>
        <p class="loading-text">Signing you in…</p>
    </div>

    <script type="module" src="script.js"></script>
    <script src="/utils/sw-manager.js"></script>
</body>
</html>
