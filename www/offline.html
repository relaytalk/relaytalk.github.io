<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline · RelayTalk</title>
  <meta name="theme-color" content="#ffffff">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #0a2540;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: rgba(0, 122, 204, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      position: relative;
    }

    .icon::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 28px;
      background: radial-gradient(circle, rgba(0, 122, 204, 0.12), transparent 70%);
      animation: iconPulse 2.4s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes iconPulse {
      0%, 100% { transform: scale(0.94); opacity: 0.6; }
      50%      { transform: scale(1.08); opacity: 1; }
    }

    .icon svg {
      width: 42px;
      height: 42px;
      stroke: #007acc;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.94rem;
      color: #5f6368;
      line-height: 1.55;
      max-width: 300px;
    }

    button {
      margin-top: 10px;
      padding: 12px 22px;
      border-radius: 12px;
      background: #007acc;
      color: #fff;
      border: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      min-height: 46px;
      font-family: inherit;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 18px rgba(0, 122, 204, 0.22);
    }

    button:hover {
      background: #0066a8;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 122, 204, 0.32);
    }

    button:active { transform: translateY(0) scale(0.98); }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      font-size: 0.8rem;
      color: #80868b;
      min-height: 18px;
      margin-top: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .icon::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h2>No Internet Connection</h2>
    <p>Check your Wi-Fi or mobile data and try again.</p>
    <button id="retryBtn" onclick="retry()">Retry</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const retryBtn = document.getElementById('retryBtn');

    async function isOnline() {
      try {
        const res = await fetch('https://relaytalk.vercel.app/manifest.json', {
          method: 'HEAD',
          cache: 'no-store'
        });
        return res.ok || res.status < 500;
      } catch (e) {
        return false;
      }
    }

    async function retry() {
      statusEl.textContent = 'Checking connection…';
      retryBtn.disabled = true;

      const online = await isOnline();

      if (online) {
        statusEl.textContent = 'Connected — reloading…';
        window.location.replace('https://relaytalk.github.io/');
      } else {
        statusEl.textContent = 'Still offline. Please check your connection.';
        retryBtn.disabled = false;
      }
    }

    window.addEventListener('online', () => {
      statusEl.textContent = 'Back online — reloading…';
      setTimeout(() => {
        window.location.replace('https://relaytalk.github.io/');
      }, 300);
    });

    (async () => {
      if (await isOnline()) {
        window.location.replace('https://relaytalk.github.io/');
      }
    })();
  </script>
</body>
</html>
