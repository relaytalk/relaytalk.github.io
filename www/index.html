<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RelayTalk</title>
  <meta name="theme-color" content="#ffffff">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-halo {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 122, 204, 0.18) 0%, rgba(0, 122, 204, 0) 70%);
      animation: haloPulse 2.4s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes haloPulse {
      0%   { transform: scale(0.9); opacity: 0.55; }
      50%  { transform: scale(1.12); opacity: 0.9; }
      100% { transform: scale(0.9); opacity: 0.55; }
    }

    .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(0, 122, 204, 0.18);
      border-top-color: rgba(0, 122, 204, 0.75);
      animation: ringSpin 1.6s linear infinite;
      will-change: transform;
    }

    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }

    .logo {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: #ffffff;
      padding: 8px;
      box-shadow:
        0 10px 28px rgba(0, 122, 204, 0.18),
        0 4px 10px rgba(0, 122, 204, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: logoBreathe 2.4s ease-in-out infinite;
      will-change: transform;
      z-index: 2;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 12px;
    }

    @keyframes logoBreathe {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #007acc;
      opacity: 0.35;
      animation: dotWave 1.3s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .dots span:nth-child(1) { animation-delay: 0s; }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotWave {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30%           { transform: translateY(-5px); opacity: 1; }
    }

    .brand {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #0a2540;
      opacity: 0.9;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-halo,
      .logo-ring,
      .logo,
      .dots span {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="loader" role="status" aria-label="Loading RelayTalk">
    <div class="logo-wrap">
      <div class="logo-halo"></div>
      <div class="logo-ring"></div>
      <div class="logo">
        <img src="https://relaytalk.vercel.app/relay.png" alt="RelayTalk">
      </div>
    </div>
    <div class="dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="brand">RelayTalk</div>
  </div>
</body>
</html>
